name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # every ported behavior test lives in station-core; station-app carries
      # the engine-layer tests and — critically — proves the app actually
      # compiles on Linux, which the release workflow otherwise discovers
      # only at packaging time.
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo test --workspace
      - run: cargo check -p station-app

  # The README screenshots, rendered by the app itself on a virtual display.
  # wgpu on lavapipe (Mesa's software Vulkan) rather than tiny-skia: it is
  # the same rendering pipeline every real install uses, so the shots show
  # what users actually see — tiny-skia has its own canvas quirks (it drops
  # the bracket's connector lines) that would document bugs users don't
  # have. xvfb provides the X server. Uploaded as an artifact so any PR
  # that touches the UI can be eyeballed without checking out the branch.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libxkbcommon-x11 is winit's keyboard glue under X11 — not preinstalled
      # on the runner, and it panics at startup without it. ffmpeg synthesises
      # the VOD Splitter shot's stand-in recording and its preview frames.
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config xvfb libxkbcommon-x11-0 ffmpeg mesa-vulkan-drivers
      # `bash` explicitly: the web-UI upload path drops the executable bit,
      # and the script shouldn't depend on a mode bit to run anyway.
      - name: Render screenshots
        run: xvfb-run -a bash ./scripts/screenshots/native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 14
