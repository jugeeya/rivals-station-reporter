name: Release

# Builds the NATIVE app (crates/station-app, Iced — no webview) on every push
# to main, every PR, and every manual run.
#
# What triggered the run decides where the output goes:
#   * pushed tag v*  -> a draft release while the three platform jobs upload,
#     published only once all three have finished (publish-release below)
#   * push to main   -> the rolling "beta" PRE-release: prepare-beta deletes
#     and recreates the beta release at this commit, then the platform jobs
#     upload builds into it. Prereleases never appear at /releases/latest.
#   * PRs / manual runs with no tag -> workflow artifacts on the run page
#     (14 days, not public, nothing published)
#
# Packaging is deliberately simple now that there is no webview to bundle:
#   Windows -> portable zip with the .exe
#   macOS   -> zipped .app bundle
#   Linux   -> AppImage (binary + desktop entry + icon; no gtk, no webkit)
#
# Note: the old Tauri in-app auto-updater is gone with the Tauri shell; a
# release is something users download from the Releases page.

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.6.0 (blank = build only, no release)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rolling beta: move the `beta` tag to this commit and start from an empty
  # release (see the previous incarnation of this workflow for the full
  # reasoning; the mechanics are unchanged).
  prepare-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reset the beta release to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta -y --cleanup-tag --repo '${{ github.repository }}' || true
          gh release create beta \
            --target '${{ github.sha }}' \
            --prerelease \
            --title 'Rivals Station Reporter beta (rolling)' \
            --notes 'Rolling pre-release, rebuilt on every push to main (currently ${{ github.sha }}). Native build — no webview.' \
            --repo '${{ github.repository }}'

  build:
    needs: prepare-beta
    if: ${{ !cancelled() && (needs.prepare-beta.result == 'success' || needs.prepare-beta.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # reqwest's native-tls needs OpenSSL headers on Linux; that's the only
      # system dependency left now that the webview (and its whole GTK stack)
      # is gone from the build.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Resolve release tag
        id: mode
        shell: bash
        run: |
          tag='${{ inputs.tag }}'
          beta=''
          if [ -z "$tag" ] && [ '${{ github.ref_type }}' = 'tag' ]; then
            tag='${{ github.ref_name }}'
          fi
          if [ -z "$tag" ] && [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            tag='beta'
            beta='true'
          fi
          version="$(grep -m1 '^version' crates/station-app/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Asset names carry the crate version, never the git tag — v0.5.7
      # shipped 0.5.6-named files exactly this way. Fail fast on a mismatch.
      - name: Verify the tag matches the crate version
        if: steps.mode.outputs.tag != '' && steps.mode.outputs.beta == ''
        shell: bash
        run: |
          v='${{ steps.mode.outputs.version }}'
          if [ "v$v" != '${{ steps.mode.outputs.tag }}' ]; then
            echo "::error::Tag '${{ steps.mode.outputs.tag }}' does not match crates/station-app version '$v'. Bump the version before tagging."
            exit 1
          fi

      # Beta builds stamp a prerelease version so the filename itself says
      # which CI run built it. Only this checkout is modified.
      - name: Stamp beta version
        if: steps.mode.outputs.beta != ''
        shell: bash
        run: |
          v='${{ steps.mode.outputs.version }}-beta.${{ github.run_number }}'
          sed -i.bak "0,/^version = \".*\"/s//version = \"$v\"/" crates/station-app/Cargo.toml
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "stamped $v"

      - name: Build
        shell: bash
        run: cargo build --release -p station-app

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Select-String -Path crates/station-app/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/rivals-station-reporter.exe -DestinationPath "dist/Rivals.Station.Reporter_${v}_x64-windows.zip"

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          v="$(grep -m1 '^version' crates/station-app/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          APP="Rivals Station Reporter.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp target/release/rivals-station-reporter "$APP/Contents/MacOS/"
          cp src-tauri/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Rivals Station Reporter</string>
            <key>CFBundleDisplayName</key><string>Rivals Station Reporter</string>
            <key>CFBundleIdentifier</key><string>io.github.jugeeya.rivals-station-reporter</string>
            <key>CFBundleExecutable</key><string>rivals-station-reporter</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict></plist>
          PLIST
          ditto -c -k --keepParent "$APP" "dist/Rivals.Station.Reporter_${v}_macos.zip"

      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          v="$(grep -m1 '^version' crates/station-app/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          mkdir -p AppDir/usr/bin dist
          cp target/release/rivals-station-reporter AppDir/usr/bin/
          cp src-tauri/icons/128x128.png AppDir/rivals-station-reporter.png
          cat > AppDir/rivals-station-reporter.desktop <<EOF
          [Desktop Entry]
          Name=Rivals Station Reporter
          Exec=rivals-station-reporter
          Icon=rivals-station-reporter
          Type=Application
          Categories=Utility;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/rivals-station-reporter" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -sL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "dist/Rivals.Station.Reporter_${v}_amd64.AppImage"

      - name: Upload to release
        if: steps.mode.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For real tags the release may not exist yet — first platform job
          # to get here creates it as a draft (losers of the create race fall
          # through to the upload); publish-release flips it live once ALL
          # platforms uploaded. The beta release always exists (prepare-beta).
          if [ -z '${{ steps.mode.outputs.beta }}' ]; then
            gh release create '${{ steps.mode.outputs.tag }}' \
              --draft \
              --title 'Rivals Station Reporter ${{ steps.mode.outputs.tag }}' \
              --notes 'See the commit log for changes.' \
              --repo '${{ github.repository }}' || true
          fi
          gh release upload '${{ steps.mode.outputs.tag }}' dist/* --clobber --repo '${{ github.repository }}'

      - name: Upload installers (artifacts)
        if: steps.mode.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  # Only for real tags: create the release as a draft up front is no longer
  # needed (uploads go via `gh release upload`), but the all-platforms gate
  # stays — the release is created here AFTER every platform built, so it
  # never appears at /releases/latest incomplete.
  publish-release:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then tag='${{ github.ref_name }}'; fi
          gh release edit "$tag" --draft=false --repo '${{ github.repository }}' || true
