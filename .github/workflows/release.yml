name: Release

# Builds the installers (NSIS .exe on Windows, .app/.dmg on macOS, .deb/
# .AppImage on Linux) on EVERY push to main, every PR, and every manual run —
# so there is always a fresh downloadable build without having to cut a tag
# first.
#
# What triggered the run decides where the output goes:
#   * pushed tag v*  -> a draft release while the three platform jobs upload,
#     published only once all three have finished (see publish-release below)
#   * push to main   -> the rolling "beta" PRE-release: prepare-beta deletes
#     and recreates the beta release at this commit, then the platform jobs
#     upload installers into it. Prereleases never appear at
#     /releases/latest, so the installed apps' updater (which reads
#     releases/latest/download/latest.json) never sees beta builds — and no
#     updater artifacts are built for them anyway (base config, no signing
#     needed).
#   * PRs / manual runs with no tag -> uploaded as workflow artifacts on the
#     run page (retained 14 days, not public, nothing published)
#
# Why the release starts as a draft even though tagging is meant to ship:
# the three OS jobs run in parallel and each merges its own platform entries
# into the release as it finishes, so if they were published immediately
# there would be a window (windows-latest is routinely last, and can trail
# by a couple of minutes) where latest.json is live but missing a platform.
# An installed app checking for updates in that window gets "none of the
# fallback platforms were found in the response" for no reason a user can
# act on. Drafts don't appear at /releases/latest, so the updater keeps
# seeing the previous complete release for the whole build, then the new one
# appears atomically once publish-release flips it.
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  # Manual runs must name the tag explicitly to publish — github.ref_name
  # would be the branch ("main") here, which would publish a release called
  # "main". Leave it blank to just get a build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0 (blank = build only, no release)'
        required: false

# One run at a time per ref: two quick pushes to main would otherwise race
# each other at the beta release (delete/recreate/upload interleaving).
# Superseded runs are cancelled — the newer commit's build replaces them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rolling beta: move the `beta` tag to this commit and start from an empty
  # release, so it never mixes this build's installers with a previous
  # build's (asset names carry the version, so a version bump would
  # otherwise leave both generations listed side by side). Deleting is safe
  # for the same reason the whole channel is: it's a prerelease, invisible
  # to /releases/latest and the updater. Running BEFORE the build matrix
  # also means the release already exists when three tauri-action jobs go
  # looking for it, so they never race each other to create it.
  prepare-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reset the beta release to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta -y --cleanup-tag --repo '${{ github.repository }}' || true
          gh release create beta \
            --target '${{ github.sha }}' \
            --prerelease \
            --title 'Rivals Station Reporter beta (rolling)' \
            --notes 'Rolling pre-release, rebuilt on every push to main (currently ${{ github.sha }}). Grab installers here to try what has landed since the last real release; installed apps never auto-update to these.' \
            --repo '${{ github.repository }}'

  build:
    # Waits on prepare-beta when it ran (push to main); for tags, PRs and
    # manual runs that job is skipped, and `!cancelled()` + accepting the
    # 'skipped' result lets the build proceed anyway — a bare `needs` would
    # skip the whole matrix along with it.
    needs: prepare-beta
    if: ${{ !cancelled() && (needs.prepare-beta.result == 'success' || needs.prepare-beta.result == 'skipped') }}
    # tauri-action creates the release, which the default read-only GITHUB_TOKEN
    # can't do — without this the build succeeds and then 403s at the upload.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          # Pinned, NOT ubuntu-latest. A Linux binary requires whatever glibc
          # it was linked against or newer, and nothing bundles glibc — so the
          # builder's glibc is the hard floor on what the .AppImage/.deb can
          # run on. ubuntu-latest silently moved to 24.04 (glibc 2.39), which
          # put that floor above SteamOS 3.6 (glibc 2.37): the Steam Deck
          # could not load the binary at all. 22.04 is glibc 2.35, comfortably
          # under every target we care about. This is why AppImages are
          # conventionally built on the oldest distro still supported rather
          # than the newest available.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri v2's webview + tray/appindicator glue, plus the bits `reqwest`
      # needs for TLS on Linux: unlike Windows (schannel) and macOS
      # (Security.framework), `native-tls` here links against OpenSSL, so it
      # needs the dev headers and pkg-config to find them (see the comment on
      # the `reqwest` dependency in crates/station-core/Cargo.toml).
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - run: pnpm install

      # One place decides what kind of run this is, so the build step below
      # stays a single invocation instead of three near-identical copies.
      # `tag` is what tauri-action targets ('' = no release, just artifacts);
      # `beta` marks the rolling prerelease so the real-release extras
      # (updater artifacts, draft-then-publish) stay off for it.
      - name: Resolve release tag
        id: mode
        shell: bash
        run: |
          tag='${{ inputs.tag }}'
          beta=''
          if [ -z "$tag" ] && [ '${{ github.ref_type }}' = 'tag' ]; then
            tag='${{ github.ref_name }}'
          fi
          if [ -z "$tag" ] && [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            tag='beta'
            beta='true'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      # Every asset name AND latest.json's `version` come from package.json
      # (tauri.conf.json points at it) — never from the git tag. v0.5.7 was
      # cut while package.json still said 0.5.6: the release shipped
      # 0.5.6-named installers and a latest.json claiming 0.5.6, which no
      # installed app would ever accept as an update. Fail fast on that
      # mismatch instead of publishing a dud.
      - name: Verify the tag matches package.json
        if: steps.mode.outputs.tag != '' && steps.mode.outputs.beta == ''
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != '${{ steps.mode.outputs.tag }}' ]; then
            echo "::error::Tag '${{ steps.mode.outputs.tag }}' does not match package.json version '$v'. Bump package.json (and the Cargo.toml versions) before tagging."
            exit 1
          fi

      # Beta installers otherwise carry the plain base version and are
      # indistinguishable from a real release's files once downloaded. Stamp
      # a prerelease version (e.g. 0.5.8-beta.42) so the filename itself says
      # what it is and which CI run built it. Only this job's checkout is
      # modified — nothing is committed.
      - name: Stamp beta version
        if: steps.mode.outputs.beta != ''
        shell: bash
        run: |
          base="$(node -p "require('./package.json').version")"
          npm pkg set version="${base}-beta.${{ github.run_number }}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. Installed stations refuse an update
          # whose signature does not verify against the public key baked into
          # tauri.conf.json, so without this secret a tagged build produces a
          # latest.json nothing will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # Updater artifacts are off in the base config and switched on only
          # here, for REAL tagged builds — not beta: beta installers are for
          # trying by hand, never for the updater, so they need no signing.
          # `createUpdaterArtifacts` makes the signing key mandatory: a build
          # that cannot read the secret does not skip signing, it fails
          # outright with a key-decode error. Enabling it globally therefore
          # breaks every build without secret access, which notably includes
          # pull requests from forks, where the failure looks nothing like
          # the contributor's actual change.
          # Path is relative to the working directory the action builds from
          # (the repo root), not to src-tauri, despite the file living there.
          args: ${{ steps.mode.outputs.tag != '' && steps.mode.outputs.beta == '' && '--config src-tauri/tauri.release.conf.json' || '' }}
          tagName: ${{ steps.mode.outputs.tag }}
          releaseName: ${{ steps.mode.outputs.beta != '' && 'Rivals Station Reporter beta (rolling)' || format('Rivals Station Reporter {0}', steps.mode.outputs.tag) }}
          releaseBody: 'See the commit log for changes.'
          # Real tags stay a draft here; publish-release (below, needs: build)
          # flips it live once all three platform jobs have merged in, so the
          # release is never visible at /releases/latest with only some
          # platforms present (see the header comment for why that window
          # matters). Beta skips the dance: prepare-beta already created it
          # published-as-prerelease — invisible to /releases/latest by
          # definition — so a partial-platforms window is harmless there, and
          # tauri-action just uploads into the existing release.
          releaseDraft: ${{ steps.mode.outputs.beta == '' }}
          prerelease: ${{ steps.mode.outputs.beta != '' }}

      # PRs and tag-less manual runs have nowhere to attach the installers
      # (pushes to main now go to the beta release instead), so keep them on
      # the run page. Globbed rather than read from the action's
      # artifactPaths output so this stays readable and cross-platform; the
      # bundle dir is at the workspace root, not under src-tauri/.
      - name: Upload installers
        if: steps.mode.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  # Runs only for a real release (needs a resolved tag), and only after every
  # platform in the build matrix has succeeded (needs: build waits on the
  # whole matrix, not just one leg, so one failed platform blocks publishing
  # rather than shipping an incomplete release). Flips the draft the build
  # job created live in a single call, once, so the release only ever
  # appears at /releases/latest with every platform already present.
  publish-release:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: mode
        shell: bash
        run: |
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ] && [ '${{ github.ref_type }}' = 'tag' ]; then
            tag='${{ github.ref_name }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit '${{ steps.mode.outputs.tag }}' --draft=false --repo '${{ github.repository }}'
