name: Release

# Push a tag like v0.1.0 to build the installers and attach them to a draft
# GitHub release (NSIS .exe on Windows, .app/.dmg on macOS).
on:
  push:
    tags: ['v*']
  # Manual runs must name the tag explicitly — github.ref_name would be the
  # branch ("main") here, which would publish a release called "main".
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

jobs:
  build:
    # tauri-action creates the release, which the default read-only GITHUB_TOKEN
    # can't do — without this the build succeeds and then 403s at the upload.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Rivals Station Reporter ${{ inputs.tag || github.ref_name }}
          releaseBody: 'See the commit log for changes.'
          releaseDraft: true
