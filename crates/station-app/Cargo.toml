[package]
name = "station-app"
version = "0.9.5"
edition = "2021"
description = "Rivals Station Reporter: native Iced UI over station-core (no webview)"

[[bin]]
name = "rivals-station-reporter"
path = "src/main.rs"

[dependencies]
station-core = { path = "../station-core" }
serde = { workspace = true }
serde_json = { workspace = true }

# `tokio` gives Task::perform an executor that can spawn_blocking the
# hub/start.gg HTTP calls; `canvas` draws the background blooms and the
# per-game character strips; `svg`/`image` cover icons and the tray art;
# `advanced` unlocks the custom-widget API the themed dropdown needs;
# `lazy` for responsive lists.
iced = { version = "0.14", features = ["tokio", "canvas", "svg", "image", "advanced", "lazy"] }
# `process`/`fs` are for the VOD Splitter screen, which shells out to
# ffmpeg/ffprobe and writes exported cut lists.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "fs"] }

# Native pieces that used to be Tauri plugins:
rfd = "0.15"          # file/dir pickers (plugin-dialog)
auto-launch = "0.5"   # start-with-OS toggle (plugin-autostart)
open = "5"            # open URLs in the default browser (plugin-opener)
dirs = "6"            # config dir resolution (app.path())
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = "0.4.45"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uesave = "0.7.1"      # GVAS save read/write for the Tag Installer

# Tray + close-to-tray, on Windows/macOS only. On Linux, tray-icon needs the
# whole GTK/appindicator stack at BUILD time (and a gtk event loop on the
# tray's thread at runtime, which iced/winit doesn't run) — dragging GTK back
# into the one platform we rewrote this app to escape from. Linux builds get
# the designed fallback instead: no tray, closing the window quits (see
# ui/tray.rs), which is also the only sane behavior on a Deck in Game Mode.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.21"

[dev-dependencies]
# Headless view/interaction testing (VOD Splitter screen smoke test).
iced_test = "0.14"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"   # embed the app icon into the .exe
