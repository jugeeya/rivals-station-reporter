<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="232"></rect></clipPath>
    <radialGradient id="bloom-teal" cx="0.16" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.95"></stop>
      <stop offset="0.55" stop-color="#0d6e60" stop-opacity="0.45"></stop>
      <stop offset="1" stop-color="#0d6e60" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bloom-amber" cx="0.88" cy="0.90" r="0.85">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.95"></stop>
      <stop offset="1" stop-color="#92600a" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#081a1c"></rect>
    <rect width="1024" height="1024" fill="url(#bloom-teal)"></rect>
    <rect width="1024" height="1024" fill="url(#bloom-amber)"></rect>
  </g>

  <!-- live indicator: solid dot + two echo rings -->
  <circle cx="512" cy="210" r="76" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.35"></circle>
  <circle cx="512" cy="210" r="46" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.55"></circle>
  <circle cx="512" cy="210" r="22" fill="#ffffff" opacity="0.95"></circle>

  <!-- scoreboard: two bars of unequal height on a shared baseline -->
  <rect x="374" y="470" width="130" height="330" rx="28" fill="#ffffff" opacity="0.92"></rect>
  <rect x="568" y="360" width="130" height="440" rx="28" fill="#ffffff" opacity="0.92"></rect>
  <rect x="350" y="800" width="374" height="20" rx="10" fill="#ffffff" opacity="0.55"></rect>
</svg>
