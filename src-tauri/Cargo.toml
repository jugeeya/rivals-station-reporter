[package]
name = "rivals-station-reporter"
version = "0.5.9"
description = "Rivals Station Reporter: watches Rivals 2 on a tournament station and reports sets live"
edition = "2021"

[lib]
name = "rivals_station_reporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
station-core = { path = "../crates/station-core" }
# `devtools` is on for RELEASE builds too, not just debug, deliberately. When
# the webview comes up blank the failure is reported in the webview's own
# console -- which the native process cannot see, and which the in-app log
# panel cannot reach either (it lives inside the webview that failed). With
# no inspector there is no channel at all for that class of bug, which is
# what made the SteamOS white screen take so many blind attempts. Costs a
# little binary size; buys the ability to diagnose a shipped build in place.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
