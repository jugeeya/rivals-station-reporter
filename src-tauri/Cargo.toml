[package]
name = "rivals-station-reporter"
version = "0.2.0"
description = "Rivals Station Reporter — watches Rivals 2 on a tournament station and reports sets live"
edition = "2021"

[lib]
name = "rivals_station_reporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
station-core = { path = "../crates/station-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4"
